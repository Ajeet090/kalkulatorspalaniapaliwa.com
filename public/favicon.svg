<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark rounded background matching brand color -->
  <rect width="32" height="32" rx="7" fill="#171717"/>

  <!-- Fuel pump body -->
  <rect x="7" y="9" width="11" height="15" rx="1.5" fill="white"/>

  <!-- Display screen (blue accent) -->
  <rect x="8.5" y="10.5" width="8" height="5" rx="1" fill="#0070f3"/>

  <!-- Pump base / floor line -->
  <rect x="7" y="22" width="11" height="2" rx="0" fill="white" opacity="0.15"/>

  <!-- Fuel nozzle arm (horizontal) -->
  <rect x="18" y="12.5" width="6" height="2" rx="1" fill="white"/>

  <!-- Nozzle (vertical drop) -->
  <rect x="22" y="14.5" width="2" height="4" rx="1" fill="white"/>

  <!-- Nozzle tip / drip -->
  <circle cx="23" cy="19.5" r="1.2" fill="#0070f3"/>

  <!-- Fuel drop on nozzle tip (accent) -->
  <path d="M23 21 C23 21 21.2 22.8 21.2 23.8 C21.2 24.8 22.0 25.5 23 25.5 C24.0 25.5 24.8 24.8 24.8 23.8 C24.8 22.8 23 21 23 21Z" fill="#0070f3"/>
</svg>
